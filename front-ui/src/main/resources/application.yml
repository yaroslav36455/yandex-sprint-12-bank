spring:
  application:
    name: front-ui
  security:
    oauth2:
      client:
        registration:
          bank-services-cc:
            provider: keycloak
            client-id: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_ID}
            client-secret: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/token
      resourceserver:
        jwt:
          jwk-set-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/certs
  zipkin:
    base-url: ${YANDEX_SPRINT_12_ZIPKIN_URL}
    sleuth:
      sampler:
        probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${YANDEX_SPRINT_12_ZIPKIN_URL}/api/v2/spans

clients:
  account-service:
    url: "http://yandex-sprint-12-account:8080"
  transfer-service:
    url: "http://yandex-sprint-12-transfer:8080"
  cash-service:
    url: "http://yandex-sprint-12-cash:8080"


logging:
  level:
    org.springframework.web.reactive.result.method.annotation: DEBUG