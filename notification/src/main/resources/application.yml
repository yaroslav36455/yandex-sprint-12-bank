spring:
  application:
    name: notification
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/certs
  kafka:
    bootstrap-servers: bank-dev-kafka:9092
    consumer:
      group-id: yandex-practicum-consumer
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: by.tyv.notification.model.dto
        spring.json.value.default.type: by.tyv.notification.model.dto.NotificationDto
        spring.json.use.type.headers: false
  zipkin:
    base-url: ${YANDEX_SPRINT_12_ZIPKIN_URL}
    sleuth:
      sampler:
        probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${YANDEX_SPRINT_12_ZIPKIN_URL}/api/v2/spans

kafka:
  retries: 5
  backoff:
    initial: 500
    multiplier: 2.0
    max: 10000