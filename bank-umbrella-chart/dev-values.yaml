keycloak:
  postgresql:
    enabled: true
    auth:
      password: "pass"
    image:
      tag: "latest"
      digest: "sha256:2a7dbbb704430870c9f4e76ccf2a532dd0c6be99774d0cb064e0e5b9c6889db1"

  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: "26.3.3-debian-12-r0"

  fullnameOverride: yandex-sprint-11-keycloak

  auth:
    adminUser: admin
    adminPassword: admin

  service:
    ports:
      http: 8080

  extraEnvVars:
    - name: KEYCLOAK_LOG_LEVEL
      value: "DEBUG"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KC_HTTP_ENABLED
      value: "true"
    - name: KC_HOSTNAME_STRICT
      value: "false"
    - name: KC_HOSTNAME_STRICT_HTTPS
      value: "false"
    - name: KEYCLOAK_EXTRA_ARGS
      value: "--import-realm --verbose"
    - name: KC_PROXY_HEADERS
      value: "xforwarded"
    - name: KC_HOSTNAME
      value: "keycloak.local"

  # ===== IMPORT REALM =====
  extraVolumes:
    - name: realm-import
      configMap:
        name: keycloak-import
    - name: realm-import-tmp
      emptyDir: {}

  extraVolumeMounts:
    - name: realm-import-tmp
      mountPath: /opt/bitnami/keycloak/data/import

  initContainers:
    - name: copy-realm
      image: busybox:1.36
      command: ["/bin/sh","-c"]
      args:
        - |
          set -eux
          echo "=== /cm ==="
          ls -la /cm
          echo "=== target before ==="
          ls -la /opt/bitnami/keycloak/data/import || true
          cp -v /cm/* /opt/bitnami/keycloak/data/import/
          echo "=== target after ==="
          ls -la /opt/bitnami/keycloak/data/import
      volumeMounts:
        - name: realm-import
          mountPath: /cm
          readOnly: true
        - name: realm-import-tmp
          mountPath: /opt/bitnami/keycloak/data/import



account:
  k8sName: yandex-sprint-11-account
  replicaCount: 1
  image:
    repository: yandex-sprint-11-account
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    YANDEX_SPRINT_11_ACCOUNT_POSTGRES_DB_PORT: "5432"
    YANDEX_SPRINT_11_ACCOUNT_POSTGRES_DB_NAME: "db_account"
    YANDEX_SPRINT_11_ACCOUNT_POSTGRES_DB_USER_NAME: "user"
    YANDEX_SPRINT_11_KEYCLOAK_REALM: "bank-realm"
    YANDEX_SPRINT_11_KEYCLOAK_INTERNAL_CALL_CLIENT_ID: "service-client-id"
    YANDEX_SPRINT_11_KEYCLOAK_USER_MANAGEMENT_CLIENT_ID: "user-management-client-id"
  secretEnv:
    - name: YANDEX_SPRINT_11_ACCOUNT_POSTGRES_DB_USER_PASSWORD
      secretKey: YANDEX_SPRINT_11_ACCOUNT_POSTGRES_DB_USER_PASSWORD
    - name: YANDEX_SPRINT_11_KEYCLOAK_INTERNAL_CALL_CLIENT_SECRET
      secretKey: YANDEX_SPRINT_11_KEYCLOAK_INTERNAL_CALL_CLIENT_SECRET
    - name: YANDEX_SPRINT_11_KEYCLOAK_USER_MANAGEMENT_CLIENT_SECRET
      secretKey: YANDEX_SPRINT_11_KEYCLOAK_USER_MANAGEMENT_CLIENT_SECRET
  probes:
    startupPath: /actuator/health/liveness
    readinessPath: /actuator/health/readiness
    livenessPath: /actuator/health/liveness


