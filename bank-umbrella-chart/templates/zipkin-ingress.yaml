apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yandex-sprint-12-zipkin
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: zipkin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yandex-sprint-12-zipkin
                port:
                  number: 9411
