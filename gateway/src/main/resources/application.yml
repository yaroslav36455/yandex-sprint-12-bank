spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: yandex-sprint-12-front-ui-get-id
              uri: http://yandex-sprint-12-front-ui:8080
              predicates:
                - Method=GET
                - Path=/, /main, /signup, /logout
              filters:
                - TokenRelay
            - id: yandex-sprint-12-front-ui-post-id
              uri: http://yandex-sprint-12-front-ui:8080
              predicates:
                - Method=POST
                - Path=/signup,/user/**
              filters:
                - TokenRelay
            - id: yandex-sprint-12-exchange-api-rates
              uri: http://yandex-sprint-12-exchange:8080
              predicates:
                - Method=GET
                - Path=/api/rates
              filters:
                - RemoveResponseHeader=Authorization
          default-filters:
            - RemoveResponseHeader=Set-Cookie
  security:
    oauth2:
      client:
        registration:
          bank-services-cc:
            provider: keycloak
            client-id: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_ID}
            client-secret: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_SECRET}
            authorization-grant-type: client_credentials
          user-token-ac:
            provider: keycloak
            client-id: ${YANDEX_SPRINT_12_KEYCLOAK_USER_CLIENT_ID}
            authorization-grant-type: authorization_code
            scope: openid,profile,user
            redirect-uri: "http://gateway.local/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            authorization-uri: http://keycloak.local/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/auth
            token-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/token
            jwk-set-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/certs
      resourceserver:
        jwt:
          issuer-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}
  zipkin:
    base-url: ${YANDEX_SPRINT_12_ZIPKIN_URL}
    sleuth:
      sampler:
        probability: 1.0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    prometheus:
      access: unrestricted
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${YANDEX_SPRINT_12_ZIPKIN_URL}/api/v2/spans

server:
  port: 9090