spring:
  scheduling:
    enabled: false
  r2dbc:
    url:
    username:
    password:
  liquibase:
    driver-class-name:
    url:
    user:
    password:
    contexts:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          bank-services-cc:
            provider: keycloak
            client-id: test
            client-secret: test
            authorization-grant-type: client_credentials
          user-manager-cc:
            provider: keycloak
            client-id: test
            client-secret: test
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://localhost:9999/token
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/.well-known/jwks.json
  kafka:
    bootstrap-servers: bank-dev-kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
        acks: all
        retries: 10
        delivery.timeout.ms: 120000
        request.timeout.ms: 30000
        spring.json.add.type.headers: false
        max.block.ms: 10000


testcontainers:
  postgres:
    tag: 17.5-alpine3.22

application:
  r2dbc:
    auditing:
      enable: true
  scheduling:
    enable: false


logging:
  level:
    org:
      springframework:
        web: DEBUG

clients:
  keycloak:
    url: "http://yandex-sprint-11-keycloak:8080"
    realm: "test-realm"
