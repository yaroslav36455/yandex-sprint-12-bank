spring:
  application:
    name: exchange-generator
  security:
    oauth2:
      client:
        registration:
          bank-services-cc:
            provider: keycloak
            client-id: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_ID}
            client-secret: ${YANDEX_SPRINT_12_KEYCLOAK_INTERNAL_CALL_CLIENT_SECRET}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: http://yandex-sprint-12-keycloak:8080/realms/${YANDEX_SPRINT_12_KEYCLOAK_REALM}/protocol/openid-connect/token
  zipkin:
    base-url: ${YANDEX_SPRINT_12_ZIPKIN_URL}
    sleuth:
      sampler:
        probability: 1.0

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: b3
  zipkin:
    tracing:
      endpoint: ${YANDEX_SPRINT_12_ZIPKIN_URL}/api/v2/spans

clients:
  exchange-service:
    url: "http://yandex-sprint-12-exchange:8080"

application:
  scheduling:
    enable: true
